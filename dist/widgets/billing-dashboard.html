<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPL Billing Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --fpl-primary:#00a6d6;
    --fpl-secondary:#005b96;
    --fpl-accent:#f7941d;
    --fpl-bg:#f4f6f9;
    --fpl-card:#ffffff;
    --fpl-text:#1e293b;
    --fpl-muted:#64748b;
    --fpl-border:#e2e8f0;
    --fpl-green:#16a34a;
    --fpl-green-bg:#dcfce7;
    --radius:12px;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.06);
  }

  html{font-size:15px}
  body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
    background:var(--fpl-bg);
    color:var(--fpl-text);
    line-height:1.5;
    padding:16px;
    min-height:100vh;
  }

  /* ── Loading State ───────────────────────── */
  #loading{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;min-height:320px;
  }
  .spinner{
    width:44px;height:44px;
    border:4px solid var(--fpl-border);
    border-top-color:var(--fpl-primary);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{color:var(--fpl-muted);font-size:.95rem}

  /* ── Dashboard (hidden until data) ───────── */
  #dashboard{display:none}

  /* ── Cards ───────────────────────────────── */
  .card{
    background:var(--fpl-card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:24px;
    margin-bottom:16px;
  }
  .card-title{
    font-size:.8rem;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;color:var(--fpl-muted);margin-bottom:12px;
  }

  /* ── Summary Header ─────────────────────── */
  .summary-header{
    display:flex;flex-wrap:wrap;gap:20px;align-items:center;
    justify-content:space-between;
  }
  .summary-total{
    font-size:2.4rem;font-weight:700;
    background:linear-gradient(135deg,var(--fpl-secondary),var(--fpl-primary));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .summary-meta{display:flex;flex-wrap:wrap;gap:24px}
  .meta-item{display:flex;flex-direction:column;gap:2px}
  .meta-label{font-size:.75rem;color:var(--fpl-muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
  .meta-value{font-size:.95rem;font-weight:600;color:var(--fpl-text)}

  .due-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:linear-gradient(135deg,var(--fpl-accent),#fbbf24);
    color:#fff;font-weight:700;font-size:.82rem;
    padding:6px 14px;border-radius:20px;
    box-shadow:0 2px 8px rgba(247,148,29,.35);
  }
  .due-badge svg{width:14px;height:14px;fill:currentColor}

  /* ── Grid ─────────────────────────────────── */
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media(max-width:680px){
    .grid{grid-template-columns:1fr}
  }

  /* ── Chart ────────────────────────────────── */
  .chart-wrap{position:relative;max-width:320px;margin:0 auto}
  .chart-center-label{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    text-align:center;pointer-events:none;
  }
  .chart-center-label .total{font-size:1.5rem;font-weight:700;color:var(--fpl-secondary)}
  .chart-center-label .sub{font-size:.72rem;color:var(--fpl-muted);text-transform:uppercase;letter-spacing:.04em}

  .legend{
    display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;justify-content:center;
  }
  .legend-item{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--fpl-text)}
  .legend-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0}

  /* ── Payment List ────────────────────────── */
  .payment-list{list-style:none}
  .payment-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 0;border-bottom:1px solid var(--fpl-border);
    gap:12px;
  }
  .payment-item:last-child{border-bottom:none}
  .payment-icon{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--fpl-primary),var(--fpl-secondary));
    color:#fff;
  }
  .payment-icon svg{width:18px;height:18px;fill:currentColor}
  .payment-info{flex:1;min-width:0}
  .payment-date{font-weight:600;font-size:.9rem}
  .payment-method{font-size:.78rem;color:var(--fpl-muted)}
  .payment-amount{
    font-weight:700;font-size:1rem;color:var(--fpl-secondary);white-space:nowrap;
  }

  /* ── AutoPay Badge ───────────────────────── */
  .autopay-bar{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;
  }
  .autopay-status{
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 16px;border-radius:20px;font-weight:700;font-size:.85rem;
  }
  .autopay-status.enabled{background:var(--fpl-green-bg);color:var(--fpl-green)}
  .autopay-status.disabled{background:#fee2e2;color:#dc2626}
  .autopay-status .dot{
    width:8px;height:8px;border-radius:50%;background:currentColor;
    animation:pulse-dot 1.6s ease-in-out infinite;
  }
  @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.35}}

  .autopay-next{font-size:.9rem;color:var(--fpl-muted)}
  .autopay-next strong{color:var(--fpl-text)}
</style>
</head>
<body>

<!-- Loading State -->
<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Loading your billing dashboard&hellip;</div>
</div>

<!-- Dashboard (shown after data arrives) -->
<div id="dashboard">

  <!-- ── Bill Summary ── -->
  <div class="card" id="summary-card">
    <div class="card-title">Current Bill</div>
    <div class="summary-header">
      <div>
        <div class="summary-total" id="bill-total"></div>
        <div style="margin-top:4px">
          <span class="due-badge">
            <svg viewBox="0 0 20 20"><path d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 011 1v3a1 1 0 11-2 0V8a1 1 0 011-1zm4 0a1 1 0 011 1v3a1 1 0 11-2 0V8a1 1 0 011-1z"/></svg>
            Due <span id="due-date"></span>
          </span>
        </div>
      </div>
      <div class="summary-meta">
        <div class="meta-item">
          <span class="meta-label">Billing Period</span>
          <span class="meta-value" id="billing-period"></span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Usage</span>
          <span class="meta-value" id="kwh-used"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Chart + Payments Grid ── -->
  <div class="grid">

    <!-- Donut Chart -->
    <div class="card">
      <div class="card-title">Charge Breakdown</div>
      <div class="chart-wrap">
        <canvas id="donutChart"></canvas>
        <div class="chart-center-label">
          <div class="total" id="chart-center-total"></div>
          <div class="sub">Total</div>
        </div>
      </div>
      <div class="legend" id="chart-legend"></div>
    </div>

    <!-- Payment History -->
    <div class="card">
      <div class="card-title">Recent Payments</div>
      <ul class="payment-list" id="payment-list"></ul>
    </div>
  </div>

  <!-- ── AutoPay ── -->
  <div class="card" id="autopay-card">
    <div class="autopay-bar">
      <div class="autopay-status" id="autopay-badge"></div>
      <div class="autopay-next" id="autopay-next"></div>
    </div>
  </div>

</div><!-- /dashboard -->

<script>
/* ──────────────────────────────────────────────
   MCP Apps Bridge + Rendering
   ────────────────────────────────────────────── */
(function () {
  'use strict';

  const PROTOCOL_VERSION = '2026-01-26';
  let rpcId = 0;
  let initialized = false;

  // ── Helpers ──────────────────────────────────
  function sendRpc(method, params) {
    const msg = {
      jsonrpc: '2.0',
      id: ++rpcId,
      method: method
    };
    if (params) msg.params = params;
    window.parent.postMessage(msg, '*');
    return msg.id;
  }

  function sendNotification(method, params) {
    const msg = {
      jsonrpc: '2.0',
      method: method
    };
    if (params) msg.params = params;
    window.parent.postMessage(msg, '*');
  }

  function fmt(n) {
    return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // ── Render Dashboard ────────────────────────
  function render(data) {
    if (!data || !data.current_bill) return;

    const bill = data.current_bill;
    const payments = data.payments || [];
    const autopay = data.autopay || {};

    // Summary
    document.getElementById('bill-total').textContent = fmt(bill.total);
    document.getElementById('due-date').textContent = fmtDate(bill.due_date);
    document.getElementById('billing-period').textContent = bill.billing_period;
    document.getElementById('kwh-used').textContent = Number(bill.kwh_used).toLocaleString() + ' kWh';
    document.getElementById('chart-center-total').textContent = fmt(bill.total);

    // Donut Chart
    const charges = bill.charges || [];
    const palette = ['#00a6d6', '#005b96', '#f7941d', '#0ea5e9', '#6366f1', '#ec4899', '#14b8a6', '#a855f7'];
    const colors = charges.map(function (_, i) { return palette[i % palette.length]; });

    const ctx = document.getElementById('donutChart').getContext('2d');
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: charges.map(function (c) { return c.name; }),
        datasets: [{
          data: charges.map(function (c) { return c.amount; }),
          backgroundColor: colors,
          borderColor: '#fff',
          borderWidth: 2,
          hoverOffset: 6
        }]
      },
      options: {
        cutout: '68%',
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1e293b',
            titleFont: { family: 'system-ui', weight: '600' },
            bodyFont: { family: 'system-ui' },
            padding: 10,
            cornerRadius: 8,
            callbacks: {
              label: function (tip) {
                return ' ' + tip.label + ': ' + fmt(tip.raw);
              }
            }
          }
        }
      }
    });

    // Custom legend
    var legendEl = document.getElementById('chart-legend');
    legendEl.innerHTML = '';
    charges.forEach(function (c, i) {
      var item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML =
        '<span class="legend-swatch" style="background:' + colors[i] + '"></span>' +
        '<span>' + c.name + ' — ' + fmt(c.amount) + '</span>';
      legendEl.appendChild(item);
    });

    // Payments
    var listEl = document.getElementById('payment-list');
    listEl.innerHTML = '';
    payments.forEach(function (p) {
      var li = document.createElement('li');
      li.className = 'payment-item';
      li.innerHTML =
        '<div class="payment-icon">' +
          '<svg viewBox="0 0 20 20"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4zm14 5H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h2a1 1 0 110 2H5a1 1 0 01-1-1z"/></svg>' +
        '</div>' +
        '<div class="payment-info">' +
          '<div class="payment-date">' + fmtDate(p.date) + '</div>' +
          '<div class="payment-method">' + p.method + '</div>' +
        '</div>' +
        '<div class="payment-amount">' + fmt(p.amount) + '</div>';
      listEl.appendChild(li);
    });

    // AutoPay
    var badge = document.getElementById('autopay-badge');
    var nextEl = document.getElementById('autopay-next');

    if (autopay.enabled) {
      badge.className = 'autopay-status enabled';
      badge.innerHTML = '<span class="dot"></span> AutoPay Active';
      nextEl.innerHTML = 'Next payment of <strong>' + fmt(autopay.next_amount) +
        '</strong> on <strong>' + fmtDate(autopay.next_date) + '</strong>';
    } else {
      badge.className = 'autopay-status disabled';
      badge.innerHTML = '<span class="dot"></span> AutoPay Off';
      nextEl.innerHTML = 'Enable AutoPay to never miss a payment.';
    }

    // Show dashboard, hide loading
    document.getElementById('loading').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  }

  // ── MCP Apps Bridge ─────────────────────────
  function handleMessage(event) {
    var msg = event.data;
    if (!msg || typeof msg !== 'object' || msg.jsonrpc !== '2.0') return;

    // Response to our ui/initialize
    if (msg.id && msg.result && !initialized) {
      initialized = true;
      // Send initialized notification
      sendNotification('ui/notifications/initialized');
    }

    // Tool result notification
    if (msg.method === 'ui/notifications/tool-result') {
      var params = msg.params || {};
      var content = params.structuredContent || params.content;
      if (content) {
        // content might be a string or already parsed
        var parsed = typeof content === 'string' ? JSON.parse(content) : content;
        render(parsed);
      }
    }
  }

  window.addEventListener('message', handleMessage);

  // ── Initialization ──────────────────────────
  function init() {
    // 1. Check window.openai.toolOutput fallback first
    if (window.openai && window.openai.toolOutput) {
      try {
        var fallback = typeof window.openai.toolOutput === 'string'
          ? JSON.parse(window.openai.toolOutput)
          : window.openai.toolOutput;
        render(fallback);
        return; // Data already available, no need for bridge
      } catch (e) {
        // Ignore parse errors, continue with bridge
      }
    }

    // 2. Send ui/initialize over the bridge
    sendRpc('ui/initialize', {
      appInfo: {
        name: 'FPL Billing Dashboard',
        description: 'Bill breakdown and payment history for FPL utility customers',
        version: '1.0.0'
      },
      appCapabilities: {
        toolResults: true
      },
      protocolVersion: PROTOCOL_VERSION
    });
  }

  // Wait for Chart.js then start
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
