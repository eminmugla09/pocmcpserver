<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPL EVolution Charging History</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --ev-green:#27ae60;
    --ev-green-light:#e8f8ef;
    --ev-green-dark:#1e8449;
    --fpl-blue:#00a6d6;
    --fpl-blue-dark:#005b96;
    --amber:#f7941d;
    --amber-light:#fef3e2;
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#1e293b;
    --muted:#64748b;
    --border:#e2e8f0;
    --radius:12px;
    --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.06);
  }

  html{font-size:15px}
  body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    padding:16px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .widget{
    width:100%;
    max-width:780px;
    margin:0 auto;
  }

  /* ── Loading State ───────────────────────── */
  #loading{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;min-height:360px;
  }
  .spinner{
    width:44px;height:44px;
    border:4px solid var(--border);
    border-top-color:var(--ev-green);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{color:var(--muted);font-size:.95rem}

  /* ── Dashboard (hidden until data) ───────── */
  #dashboard{display:none}

  /* ── Cards ───────────────────────────────── */
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:24px;
    margin-bottom:16px;
  }
  .card-title{
    font-size:.8rem;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;color:var(--muted);margin-bottom:12px;
  }

  /* ── Header Card ─────────────────────────── */
  .header-card{
    background:linear-gradient(135deg,var(--ev-green),var(--ev-green-dark));
    color:#fff;
    padding:24px 28px;
  }
  .header-card .card-title{color:rgba(255,255,255,.7)}
  .header-top{
    display:flex;flex-wrap:wrap;align-items:flex-start;
    justify-content:space-between;gap:16px;
  }
  .vehicle-name{
    font-size:1.6rem;font-weight:700;letter-spacing:-.02em;
    line-height:1.2;
  }
  .plan-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.2);
    backdrop-filter:blur(4px);
    font-weight:600;font-size:.82rem;
    padding:6px 14px;border-radius:20px;
    white-space:nowrap;
  }
  .header-details{
    display:flex;flex-wrap:wrap;gap:20px;margin-top:16px;
  }
  .header-detail{display:flex;flex-direction:column;gap:2px}
  .header-detail-label{
    font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;
    opacity:.7;font-weight:600;
  }
  .header-detail-value{font-size:.95rem;font-weight:600}

  /* ── Summary Stats ───────────────────────── */
  .stats-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
  }
  .stat-box{
    background:var(--bg);
    border-radius:8px;
    padding:16px;
    text-align:center;
  }
  .stat-label{
    font-size:.7rem;font-weight:600;text-transform:uppercase;
    letter-spacing:.05em;color:var(--muted);margin-bottom:6px;
  }
  .stat-value{font-size:1.5rem;font-weight:700}
  .stat-unit{font-size:.75rem;color:var(--muted);font-weight:500}
  .stat-value.green{color:var(--ev-green)}
  .stat-value.amber{color:var(--amber)}
  .stat-value.blue{color:var(--fpl-blue)}

  /* ── Chart Area ──────────────────────────── */
  .chart-wrap{
    position:relative;
    padding:8px 0 0;
  }
  .chart-wrap canvas{
    width:100%!important;
    max-height:300px;
  }

  /* ── Sessions Table ──────────────────────── */
  .sessions-table{
    width:100%;border-collapse:collapse;
  }
  .sessions-table thead th{
    font-size:.72rem;font-weight:600;text-transform:uppercase;
    letter-spacing:.04em;color:var(--muted);
    padding:0 12px 10px;text-align:left;
    border-bottom:2px solid var(--border);
  }
  .sessions-table thead th:last-child,
  .sessions-table tbody td:last-child{text-align:right}
  .sessions-table thead th:nth-child(n+2),
  .sessions-table tbody td:nth-child(n+2){text-align:center}

  .sessions-table tbody tr{
    border-bottom:1px solid var(--border);
    transition:background .15s;
  }
  .sessions-table tbody tr:last-child{border-bottom:none}
  .sessions-table tbody tr:hover{background:var(--bg)}
  .sessions-table tbody td{
    padding:12px;font-size:.9rem;
  }

  .off-peak-badge{
    display:inline-flex;align-items:center;gap:4px;
    padding:3px 10px;border-radius:12px;font-size:.8rem;font-weight:600;
  }
  .off-peak-badge.high{background:var(--ev-green-light);color:var(--ev-green-dark)}
  .off-peak-badge.medium{background:var(--amber-light);color:#c2770b}
  .off-peak-badge.low{background:#fee2e2;color:#dc2626}

  .savings-value{font-weight:600;color:var(--ev-green)}

  /* ── Error State ─────────────────────────── */
  .error-message{
    padding:32px 24px;text-align:center;color:#dc2626;
    font-size:.9rem;background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .hidden{display:none!important}

  /* ── Responsive ──────────────────────────── */
  @media(max-width:600px){
    body{padding:8px}
    .card{padding:16px}
    .header-card{padding:16px 20px}
    .vehicle-name{font-size:1.3rem}
    .stat-value{font-size:1.25rem}
    .sessions-table{font-size:.82rem}
    .sessions-table thead th,
    .sessions-table tbody td{padding:8px 6px}
    .chart-wrap canvas{max-height:220px}
  }
  @media(max-width:420px){
    .stats-row{grid-template-columns:1fr}
    .header-details{gap:12px}
    /* Hide duration column on very small screens */
    .sessions-table th:nth-child(3),
    .sessions-table td:nth-child(3){display:none}
  }
</style>
</head>
<body>

<!-- Loading State -->
<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Loading your EV charging history&hellip;</div>
</div>

<!-- Dashboard (shown after data arrives) -->
<div id="dashboard" class="widget">

  <!-- ── Header ── -->
  <div class="card header-card" id="header-card">
    <div class="card-title">EVolution Home</div>
    <div class="header-top">
      <div class="vehicle-name" id="vehicle-name"></div>
      <div class="plan-badge" id="plan-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span id="plan-name"></span>
      </div>
    </div>
    <div class="header-details">
      <div class="header-detail">
        <span class="header-detail-label">Charger</span>
        <span class="header-detail-value" id="charger-name"></span>
      </div>
      <div class="header-detail">
        <span class="header-detail-label">Monthly Charge</span>
        <span class="header-detail-value" id="monthly-charge"></span>
      </div>
    </div>
  </div>

  <!-- ── Summary Stats ── -->
  <div class="card">
    <div class="card-title">Year-to-Date Summary</div>
    <div class="stats-row" id="stats-row">
      <div class="stat-box">
        <div class="stat-label">Total Savings YTD</div>
        <div class="stat-value green" id="stat-savings"></div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Avg Off-Peak</div>
        <div class="stat-value amber" id="stat-offpeak"></div>
        <div class="stat-unit">of charging</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">This Month</div>
        <div class="stat-value blue" id="stat-month-kwh"></div>
        <div class="stat-unit">kWh charged</div>
      </div>
    </div>
  </div>

  <!-- ── Monthly Chart ── -->
  <div class="card">
    <div class="card-title">Monthly Charging &amp; Savings</div>
    <div class="chart-wrap">
      <canvas id="monthlyChart"></canvas>
    </div>
  </div>

  <!-- ── Recent Sessions ── -->
  <div class="card">
    <div class="card-title">Recent Charging Sessions</div>
    <table class="sessions-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>kWh</th>
          <th>Duration</th>
          <th>Off-Peak</th>
          <th>Savings</th>
        </tr>
      </thead>
      <tbody id="sessions-body"></tbody>
    </table>
  </div>

</div><!-- /dashboard -->

<!-- Error State -->
<div id="error" class="error-message hidden"></div>

<script>
/* ──────────────────────────────────────────────
   MCP Apps Bridge + Rendering
   ────────────────────────────────────────────── */
(function () {
  'use strict';

  var PROTOCOL_VERSION = '2026-01-26';
  var rpcId = 0;
  var initialized = false;
  var chart = null;

  /* ── JSON-RPC Helpers ────────────────────── */
  function sendRpc(method, params) {
    var msg = {
      jsonrpc: '2.0',
      id: ++rpcId,
      method: method
    };
    if (params) msg.params = params;
    window.parent.postMessage(msg, '*');
    return msg.id;
  }

  function sendNotification(method, params) {
    var msg = {
      jsonrpc: '2.0',
      method: method
    };
    if (params) msg.params = params;
    window.parent.postMessage(msg, '*');
  }

  /* ── Formatting Helpers ──────────────────── */
  function fmt(n) {
    return '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtDate(iso) {
    var d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function fmtDuration(hours) {
    var h = Math.floor(hours);
    var m = Math.round((hours - h) * 60);
    if (h === 0) return m + 'min';
    if (m === 0) return h + 'h';
    return h + 'h ' + m + 'min';
  }

  function offPeakClass(pct) {
    if (pct >= 90) return 'high';
    if (pct >= 70) return 'medium';
    return 'low';
  }

  /* ── Render Dashboard ────────────────────── */
  function render(data) {
    if (!data) return;

    try {
      // Header
      document.getElementById('vehicle-name').textContent = data.vehicle || 'EV Vehicle';
      document.getElementById('charger-name').textContent = data.charger || '—';
      document.getElementById('plan-name').textContent = data.plan || 'EVolution Home';
      document.getElementById('monthly-charge').textContent = data.monthly_charge ? fmt(data.monthly_charge) + '/mo' : '—';

      // Summary Stats
      document.getElementById('stat-savings').textContent = fmt(data.total_savings_ytd || 0);

      var monthlySummary = data.monthly_summary || [];
      var sessions = data.sessions || [];

      // Average off-peak across monthly summary
      if (monthlySummary.length > 0) {
        var totalOffPeak = monthlySummary.reduce(function (sum, m) { return sum + (m.off_peak_pct || 0); }, 0);
        document.getElementById('stat-offpeak').textContent = Math.round(totalOffPeak / monthlySummary.length) + '%';
      } else {
        document.getElementById('stat-offpeak').textContent = '—';
      }

      // This month kWh (last entry in monthly_summary)
      if (monthlySummary.length > 0) {
        var lastMonth = monthlySummary[monthlySummary.length - 1];
        document.getElementById('stat-month-kwh').textContent = Number(lastMonth.total_kwh).toLocaleString('en-US');
      } else {
        document.getElementById('stat-month-kwh').textContent = '—';
      }

      // Build chart
      buildChart(monthlySummary);

      // Build sessions table
      buildSessionsTable(sessions);

      // Show dashboard, hide loading
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').classList.add('hidden');
      document.getElementById('dashboard').style.display = 'block';
    } catch (err) {
      showError('Error rendering dashboard: ' + err.message);
    }
  }

  /* ── Monthly Chart ───────────────────────── */
  function buildChart(monthlySummary) {
    if (!monthlySummary || monthlySummary.length === 0) return;
    if (chart) chart.destroy();

    var labels = monthlySummary.map(function (m) { return m.month; });
    var kwhData = monthlySummary.map(function (m) { return m.total_kwh; });
    var savingsData = monthlySummary.map(function (m) { return m.savings; });
    var offPeakData = monthlySummary.map(function (m) { return m.off_peak_pct; });

    // Color bars based on off-peak percentage
    var barColors = offPeakData.map(function (pct) {
      if (pct >= 90) return 'rgba(39, 174, 96, 0.75)';
      if (pct >= 80) return 'rgba(39, 174, 96, 0.50)';
      return 'rgba(247, 148, 29, 0.65)';
    });

    var barBorderColors = offPeakData.map(function (pct) {
      if (pct >= 90) return 'rgba(39, 174, 96, 1)';
      if (pct >= 80) return 'rgba(39, 174, 96, 0.8)';
      return 'rgba(247, 148, 29, 1)';
    });

    var ctx = document.getElementById('monthlyChart').getContext('2d');

    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          {
            label: 'kWh Charged',
            type: 'bar',
            data: kwhData,
            backgroundColor: barColors,
            borderColor: barBorderColors,
            borderWidth: 1,
            borderRadius: 6,
            yAxisID: 'yKwh',
            order: 2
          },
          {
            label: 'Savings ($)',
            type: 'line',
            data: savingsData,
            borderColor: '#005b96',
            backgroundColor: 'rgba(0, 91, 150, 0.08)',
            borderWidth: 2.5,
            pointRadius: 5,
            pointBackgroundColor: '#005b96',
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
            pointHoverRadius: 7,
            tension: 0.35,
            fill: true,
            yAxisID: 'ySavings',
            order: 1
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'index',
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            position: 'bottom',
            labels: {
              usePointStyle: true,
              pointStyle: 'rectRounded',
              padding: 16,
              font: { family: 'system-ui', size: 12 },
              color: '#64748b',
              generateLabels: function (chart) {
                var defaultLabels = Chart.defaults.plugins.legend.labels.generateLabels(chart);
                // Add off-peak legend entry
                defaultLabels.push({
                  text: 'Off-peak % (bar color)',
                  fillStyle: 'rgba(247, 148, 29, 0.65)',
                  strokeStyle: 'rgba(247, 148, 29, 1)',
                  lineWidth: 1,
                  pointStyle: 'rectRounded',
                  hidden: false,
                  index: 99
                });
                return defaultLabels;
              }
            }
          },
          tooltip: {
            backgroundColor: 'rgba(30, 41, 59, 0.94)',
            titleFont: { family: 'system-ui', size: 13, weight: '600' },
            bodyFont: { family: 'system-ui', size: 12 },
            padding: 12,
            cornerRadius: 8,
            callbacks: {
              afterBody: function (tooltipItems) {
                var idx = tooltipItems[0].dataIndex;
                return 'Off-peak: ' + offPeakData[idx] + '%';
              },
              label: function (ctx) {
                var label = ctx.dataset.label || '';
                var val = ctx.parsed.y;
                if (label.includes('$')) return ' ' + label + ': $' + val.toFixed(2);
                return ' ' + label + ': ' + Number(val).toLocaleString('en-US') + ' kWh';
              }
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: {
              font: { family: 'system-ui', size: 11 },
              color: '#9ca3af',
              maxRotation: 45,
              minRotation: 0
            }
          },
          yKwh: {
            type: 'linear',
            position: 'left',
            title: {
              display: true,
              text: 'kWh',
              font: { family: 'system-ui', size: 12, weight: '600' },
              color: '#27ae60'
            },
            grid: { color: 'rgba(0, 0, 0, 0.04)' },
            ticks: {
              font: { family: 'system-ui', size: 11 },
              color: '#9ca3af',
              callback: function (v) { return Number(v).toLocaleString('en-US'); }
            },
            beginAtZero: true
          },
          ySavings: {
            type: 'linear',
            position: 'right',
            title: {
              display: true,
              text: 'Savings ($)',
              font: { family: 'system-ui', size: 12, weight: '600' },
              color: '#005b96'
            },
            grid: { drawOnChartArea: false },
            ticks: {
              font: { family: 'system-ui', size: 11 },
              color: '#9ca3af',
              callback: function (v) { return '$' + v; }
            },
            beginAtZero: true
          }
        }
      }
    });
  }

  /* ── Sessions Table ──────────────────────── */
  function buildSessionsTable(sessions) {
    var tbody = document.getElementById('sessions-body');
    tbody.innerHTML = '';

    if (!sessions || sessions.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:24px">No recent sessions</td></tr>';
      return;
    }

    sessions.forEach(function (s) {
      var tr = document.createElement('tr');
      var badgeClass = offPeakClass(s.off_peak_pct || 0);

      tr.innerHTML =
        '<td>' + fmtDate(s.date) + '</td>' +
        '<td><strong>' + Number(s.kwh).toFixed(1) + '</strong> kWh</td>' +
        '<td>' + fmtDuration(s.duration_hours || 0) + '</td>' +
        '<td><span class="off-peak-badge ' + badgeClass + '">' +
          '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>' +
          (s.off_peak_pct || 0) + '%</span></td>' +
        '<td class="savings-value">' + fmt(s.cost_savings || 0) + '</td>';

      tbody.appendChild(tr);
    });
  }

  /* ── Error Handling ──────────────────────── */
  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('dashboard').style.display = 'none';
    var el = document.getElementById('error');
    el.textContent = msg;
    el.classList.remove('hidden');
  }

  /* ── MCP Apps Bridge ─────────────────────── */
  function handleMessage(event) {
    var msg = event.data;
    if (!msg || typeof msg !== 'object') return;

    // Response to our ui/initialize
    if (msg.jsonrpc === '2.0' && msg.id && msg.result && !initialized) {
      initialized = true;
      sendNotification('ui/notifications/initialized');
    }

    // Tool result notification
    if (msg.method === 'ui/notifications/tool-result') {
      var params = msg.params || {};
      var content = params.structuredContent || params.content || params.result?.structuredContent;
      if (content) {
        var parsed = typeof content === 'string' ? JSON.parse(content) : content;
        render(parsed);
      }
      return;
    }

    // Handle JSON-RPC response with structuredContent
    if (msg.result?.structuredContent) {
      var parsed = typeof msg.result.structuredContent === 'string'
        ? JSON.parse(msg.result.structuredContent)
        : msg.result.structuredContent;
      render(parsed);
      return;
    }

    // Handle direct data posts (non-RPC fallback)
    if (msg.vehicle && msg.sessions) {
      render(msg);
    }
  }

  window.addEventListener('message', handleMessage);

  /* ── Initialization ──────────────────────── */
  function init() {
    // 1. Check window.openai.toolOutput fallback first
    if (window.openai && window.openai.toolOutput) {
      try {
        var fallback = typeof window.openai.toolOutput === 'string'
          ? JSON.parse(window.openai.toolOutput)
          : window.openai.toolOutput;
        if (fallback && (fallback.vehicle || fallback.sessions)) {
          render(fallback);
          return;
        }
      } catch (e) {
        // Ignore parse errors, continue with bridge
      }
    }

    // 2. Send ui/initialize over the bridge
    sendRpc('ui/initialize', {
      appInfo: {
        name: 'fpl-ev-charging-chart',
        title: 'FPL EVolution Charging History',
        description: 'EV charging session history and savings for FPL EVolution Home customers',
        version: '1.0.0'
      },
      appCapabilities: {
        ui: true,
        structuredContent: true,
        toolResults: true
      },
      protocolVersion: PROTOCOL_VERSION
    });

    // 3. Timeout: if no data in 15s, show error
    setTimeout(function () {
      if (document.getElementById('loading').style.display === 'none') return;
      // One last fallback check
      if (window.openai && window.openai.toolOutput) {
        try {
          var fallback = typeof window.openai.toolOutput === 'string'
            ? JSON.parse(window.openai.toolOutput)
            : window.openai.toolOutput;
          if (fallback && (fallback.vehicle || fallback.sessions)) {
            render(fallback);
            return;
          }
        } catch (e) { /* ignore */ }
      }
      showError('Timed out waiting for EV charging data. Please try again.');
    }, 15000);
  }

  // Wait for Chart.js then start
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
